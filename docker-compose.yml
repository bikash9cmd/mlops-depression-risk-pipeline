version: "3.8"

x-airflow-common: &airflow-common
  build:
    context: ./airflow
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb:3306/${MARIADB_DATABASE}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./ml:/opt/airflow/ml
    - ./data:/opt/airflow/data
    - ./models:/opt/airflow/models
    - airflow_logs:/opt/airflow/logs
  depends_on:
    mariadb:
      condition: service_healthy
    redis:
      condition: service_started

services:
  mariadb:
    image: mariadb:10.11
    container_name: mlops_mariadb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MARIADB_DATABASE}
      MYSQL_USER: ${MARIADB_USER}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    container_name: mlops_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  airflow-init:
    <<: *airflow-common
    container_name: mlops_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade &&
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER} \
          --password ${AIRFLOW_ADMIN_PASSWORD} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    container_name: mlops_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    container_name: mlops_airflow_scheduler
    command: scheduler
    depends_on:
      - airflow-init

  api:
    build:
      context: ./api
    container_name: mlops_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      MARIADB_HOST: mariadb
      MODEL_PATH: /app/models/depression_risk_model.pkl
    volumes:
      - ./models:/app/models
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - mariadb

  evidently:
    build:
      context: ./monitoring/evidently
    container_name: mlops_evidently
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./monitoring/evidently/reports:/app/reports
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mlops_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.1.0
    container_name: mlops_grafana
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  mariadb_data:
  redis_data:
  airflow_logs:
  prometheus_data:
  grafana_data:
